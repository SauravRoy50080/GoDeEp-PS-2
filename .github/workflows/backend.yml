name: Backend checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  sqlite:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m ruff check backend
      - run: python -m ruff format --check backend
      - run: python -m pytest backend/tests -q
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: godeep_ci
          POSTGRES_PASSWORD: ephemeral-ci-only
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U godeep_ci -d postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      GODEEP_TEST_POSTGRES_ADMIN_URL: postgresql+psycopg://godeep_ci:ephemeral-ci-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest backend/tests -q
