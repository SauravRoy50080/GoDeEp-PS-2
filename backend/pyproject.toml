[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "godeep-backend"
version = "0.11.0"
description = "Android security and forensic investigation backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0.36,<2.1",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "argon2-cffi>=23.1,<26",
  "androguard==4.1.4",
  "cryptography>=46.0.6,<51",
  "lxml>=5.3,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
